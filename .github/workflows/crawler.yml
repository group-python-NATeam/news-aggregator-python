name: Scheduled Crawlers

on:
  schedule:
    # Chạy mỗi 3 giờ (vào phút thứ 0 của giờ thứ 3)
    - cron: "0 */3 * * *"
  workflow_dispatch:
    # Thêm nút "Run workflow" để chạy bằng tay trên GitHub Actions tab

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # FIX: Thêm lfs: true để tải các file model AI (Git LFS)
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Crawlers
        env:
          # Sử dụng secret đã set
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Chạy 4 crawlers, mỗi cái lấy 20 bài
          python manage.py crawl_vnexpress cong-nghe --limit=20
          python manage.py crawl_dantri cong-nghe --limit=20
          python manage.py crawl_tuoitre cong-nghe --limit=20
          python manage.py crawl_thanhnien cong-nghe --limit=20
